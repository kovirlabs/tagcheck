<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Low contrast</title>
<style>:root { color-scheme: light dark; } .faint { color: #bbb; } .gray { color: #949494; } .big { font-size: 24px; } .bold { font-size: 19px; font-weight: 700; } .wide { width: 900px; }</style></head>
<body><main><h1>Readable heading</h1><p class="faint">Too faint to read</p><p class="gray big">Large gray text</p><p class="gray bold">Bold gray text</p><p class="gray">Small gray text</p><p class="faint big">Large but too faint</p><div class="wide">Wide</div></main></body>
</html>
