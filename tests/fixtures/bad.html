<!doctype html>
<html>
<head>
<title>Bad page</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tagbrush@1/tagbrush.min.css">
<style>.hero { display: flex; }</style>
</head>
<body>
<main>
  <h1>Bad</h1>
  <h3>Skipped a level</h3>
  <img src="photo.jpg">
  <input name="email">
  <label for="nowhere">Phone</label>
  <button></button>
  <a href="/home"></a>
  <div onclick="go()">Go</div>
  <span role="button">Fake</span>
  <p id="twice">One</p><p id="twice">Two</p>
  <button aria-controls="missing-menu" aria-expanded="false" aria-label="Menu">☰</button>
  <button commandfor="dlg" command="open-it">Open</button>
  <dialog id="dlg"><p>Hi</p></dialog>
  <ul id="list"><li>Item</li></ul>
  <button commandfor="list" command="--clone">Add</button>
  <section data-tag-remember><details><summary>Q</summary><p>A</p></details></section>
  <div class="hero flex" data-tag-sortable data-tagaction="disabled">Invented</div>
  <button data-tag="copy">Copy</button>
  <p style="margin-top: 2rem; --gap: 1rem">Inline layout</p>
</main>
<main>Second main</main>
</body>
</html>
